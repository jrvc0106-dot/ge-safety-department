name: Verify web app
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test real PDF layout in Chromium
        run: node scripts/pdf-browser-smoke.mjs
      - name: Upload verified PDF sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ge-one-pdf-visual-quality
          path: artifacts/pdf-quality/*.pdf
          if-no-files-found: ignore
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
