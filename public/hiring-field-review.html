<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GE ONE | Revisión de campos del expediente</title><style>body{font-family:Arial,sans-serif;background:#f2f5f7;margin:0;color:#173449}header{background:#173449;color:white;padding:20px}.box{max-width:760px;margin:20px auto;padding:18px;background:white;border-radius:12px}h1{font-size:24px}button{background:#173449;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.4}.controls{display:flex;gap:12px;justify-content:space-between;margin:20px 0}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:9px 0;padding:12px;border:2px solid #c63b32;border-radius:8px;background:#fff3f2;flex-wrap:wrap}.item.ok{border-color:#2d8465;background:#f1fbf7}.item b{font-size:13px;word-break:break-word}.tag{font-size:12px;font-weight:700;padding:5px}.tag.employer{background:#e3e9f0}.note{background:#fff5dc;border:1px solid #c7a650;padding:12px;border-radius:8px}.count{font-weight:700}input{accent-color:#16805b;width:20px;height:20px}.meter{height:9px;background:#d9e1e6;border-radius:9px}.meter span{height:100%;display:block;background:#248565;width:0}</style></head><body><header><b>G&E FLORIDA CONTRACTORS · EMPLOYEE HIRING</b></header><main class="box"><h1>Revisión de las ocho páginas originales</h1><p class="note">Herramienta de auditoría de campos. No solicita ni guarda información personal. Marcar un campo solo indica que fue revisado: no equivale a completar el PDF ni a una firma válida. El PDF maestro no se modifica.</p><p id="progress" class="count"></p><div class="meter"><span id="fill"></span></div><h2 id="page-title"></h2><div id="fields"></div><div class="controls"><button id="previous">← Página anterior</button><button id="next">Página siguiente →</button></div><p id="footer" role="status"></p></main><script>const pages={"1":["WBS_Employee_Name","WBS_Client_Number"],"2":["WBS_Employee_Signature_Typed","WBS_Sign_Date","WBS_Employee_Name","WBS_Birth_Date","WBS_Address","WBS_City_State_Zip","WBS_Phone","WBS_SSN","WBS_Email","WBS_Emergency_Contact","WBS_Emergency_Phone"],"3":["WBS_Client_Employee_Name","WBS_Department","WBS_Job_Code","WBS_Rate_Of_Pay","WBS_Work_Comp_Code","WBS_Job_Description","WBS_Original_Hire_Date"],"4":["W4_First_Name","W4_Last_Name","W4_SSN","W4_Address","W4_City_State_Zip","W4_Dep_Credits","W4_Other_Dependents","W4_Other_Income","W4_Deductions","W4_Extra_Withholding","W4_Employee_Signature_Typed","W4_Employee_Sign_Date"],"5":["I9_Last_Name","I9_First_Name","I9_Middle_Initial","I9_Other_Names","I9_Address","I9_Apt","I9_City","I9_State","I9_Zip","I9_DOB","I9_SSN","I9_Email","I9_Phone","I9_Employee_Signature_Typed","I9_Todays_Date","I9_Employer_Name_Title","I9_Employer_Signature_Typed","I9_Employer_Date","I9_First_Day_Employment"],"6":["Handbook_Print_Full_Name","Handbook_Employee_Signature_Typed","Handbook_Sign_Date"],"7":["NonDisparagement_Employee_Name","NonDisparagement_Employee_Signature_Typed","NonDisparagement_Date"],"8":[]};const employer=new Set(["WBS_Client_Number","WBS_Client_Employee_Name","WBS_Department","WBS_Job_Code","WBS_Rate_Of_Pay","WBS_Work_Comp_Code","WBS_Job_Description","WBS_Original_Hire_Date","I9_Employer_Name_Title","I9_Employer_Signature_Typed","I9_Employer_Date","I9_First_Day_Employment"]);const signatures=new Set(["WBS_Employee_Signature_Typed","W4_Employee_Signature_Typed","I9_Employee_Signature_Typed","I9_Employer_Signature_Typed","Handbook_Employee_Signature_Typed","NonDisparagement_Employee_Signature_Typed"]);const optional=new Set(["I9_Middle_Initial","I9_Other_Names","I9_Apt","W4_Dep_Credits","W4_Other_Dependents","W4_Other_Income","W4_Deductions","W4_Extra_Withholding"]);let page=1;const reviewed=new Set();function draw(){document.querySelector('#page-title').textContent='Página '+page+' de 8';const list=document.querySelector('#fields');list.replaceChildren();for(const field of pages[page]||[]){const row=document.createElement('label');row.className='item'+(reviewed.has(page+':'+field)?' ok':'');const title=document.createElement('b');title.textContent=field.replaceAll('_',' ');const tag=document.createElement('span');tag.className='tag'+(employer.has(field)?' employer':'');tag.textContent=(employer.has(field)?'G&E / Empleador':'Solicitante')+(signatures.has(field)?' · Firma':optional.has(field)?' · Opcional':' · Obligatorio');const check=document.createElement('input');check.type='checkbox';check.checked=reviewed.has(page+':'+field);check.setAttribute('aria-label','Revisar '+field);check.onchange=()=>{const id=page+':'+field;if(check.checked)reviewed.add(id);else reviewed.delete(id);draw()};row.append(title,tag,check);list.append(row)}if(!list.children.length){const empty=document.createElement('p');empty.textContent='Esta página no tiene campos digitales identificados. Debe conservarse íntegra en el PDF final.';list.append(empty)}document.querySelector('#previous').disabled=page===1;document.querySelector('#next').disabled=page===8;const all=Object.values(pages).reduce((n,a)=>n+a.length,0);document.querySelector('#progress').textContent=reviewed.size+' de '+all+' campos revisados';document.querySelector('#fill').style.width=(reviewed.size/all*100)+'%';document.querySelector('#footer').textContent='Los campos pendientes permanecen en rojo. Ningún dato personal se envía desde esta pantalla.'}document.querySelector('#previous').onclick=()=>{page=Math.max(1,page-1);draw()};document.querySelector('#next').onclick=()=>{page=Math.min(8,page+1);draw()};draw();</script></body></html>
